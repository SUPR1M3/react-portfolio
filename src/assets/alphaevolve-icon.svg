<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="disc" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- the unit square -->
  <rect x="20" y="20" width="216" height="216" rx="14" fill="none"
        stroke="#10B981" stroke-width="8" opacity="0.6"/>

  <!-- packed circles of varying radii -->
  <g filter="url(#glow)" fill="url(#disc)" stroke="#FFFFFF" stroke-width="4">
    <circle cx="82" cy="82" r="52"/>
    <circle cx="180" cy="72" r="42"/>
    <circle cx="176" cy="172" r="50"/>
    <circle cx="76" cy="184" r="42"/>
    <circle cx="128" cy="128" r="12"/>
    <circle cx="40" cy="134" r="12"/>
    <circle cx="128" cy="34" r="10"/>
    <circle cx="126" cy="220" r="12"/>
    <circle cx="220" cy="120" r="10"/>
  </g>
</svg>
