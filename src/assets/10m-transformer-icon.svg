<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="node" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF8AB3"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- faint cross-links between outer nodes -->
  <g stroke="#E91E63" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="128" y1="36" x2="220" y2="128"/>
    <line x1="220" y1="128" x2="128" y2="220"/>
    <line x1="128" y1="220" x2="36" y2="128"/>
    <line x1="36" y1="128" x2="128" y2="36"/>
  </g>

  <!-- the plus sign -->
  <g stroke="#E91E63" stroke-width="22" stroke-linecap="round">
    <line x1="128" y1="52" x2="128" y2="204"/>
    <line x1="52" y1="128" x2="204" y2="128"/>
  </g>

  <!-- nodes -->
  <g filter="url(#glow)" fill="url(#node)" stroke="#FFFFFF" stroke-width="5">
    <circle cx="128" cy="36" r="22"/>
    <circle cx="220" cy="128" r="22"/>
    <circle cx="128" cy="220" r="22"/>
    <circle cx="36" cy="128" r="22"/>
    <circle cx="128" cy="128" r="26"/>
  </g>
</svg>
