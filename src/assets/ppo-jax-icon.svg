<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2A4A"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- solid dark tile so the mark reads on any card tint -->
  <rect x="16" y="16" width="224" height="224" rx="36" fill="url(#tile)"
        stroke="#38BDF8" stroke-width="6"/>

  <!-- trust region: ratio in [1 - eps, 1 + eps] -->
  <rect x="100" y="44" width="56" height="168" fill="#38BDF8" opacity="0.22"/>
  <g stroke="#7DD3FC" stroke-width="5" stroke-dasharray="12 9">
    <line x1="100" y1="44" x2="100" y2="212"/>
    <line x1="156" y1="44" x2="156" y2="212"/>
  </g>

  <!-- clipped surrogate objective (A > 0): rises, then flattens at 1 + eps -->
  <polyline points="44,196 156,92 212,92" fill="none" filter="url(#glow)"
            stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="156" cy="92" r="15" fill="#FBBF24" stroke="#FFFFFF" stroke-width="5"/>
</svg>
